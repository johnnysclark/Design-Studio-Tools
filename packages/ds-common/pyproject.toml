[project]
name = "ds-common"
version = "0.1.0"
description = "Shared utilities for the Design Studio Tools kit: HTTP, cache, geocoding, rhino3dm helpers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8",
    "diskcache>=5",
    "pydantic>=2.5",
    "structlog>=24",
    "rhino3dm>=8",
    "platformdirs>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_common"]
