[project]
name = "site-dossier"
version = "0.1.0"
description = "Generate a site dossier (climate, sun, wind, demographics, zoning) for any address or lat/lon."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ds-common",
    "typer>=0.12",
    "rich>=13",
    "pvlib>=0.10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "jinja2>=3.1",
    "markdown>=3.5",
    "weasyprint>=61",
    "pyyaml>=6",
]

[project.scripts]
site-dossier = "site_dossier.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/site_dossier"]

[tool.hatch.build.targets.wheel.force-include]
"src/site_dossier/render/templates" = "site_dossier/render/templates"
"src/site_dossier/data" = "site_dossier/data"
