[project]
name = "design-studio-tools"
version = "0.1.0"
description = "A kit of tools for architecture/design studios. First tool: site-dossier."
readme = "README.md"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ds-common = { workspace = true }
site-dossier = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
    "vcrpy>=6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: line length handled by formatter
# B008: typer/fastapi rely on Option/Depends() calls in defaults
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["packages/ds-common/tests", "packages/site-dossier/tests"]
addopts = "-q --strict-markers"
